name: Extract project ZIP into main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract g.zip
        run: |
          test -f g.zip || { echo "g.zip was not found in the repository root"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("g.zip")
          root = Path(".").resolve()

          with ZipFile(archive) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
              z.extractall(root)

          print("ZIP extracted successfully.")
          PY

      - name: Commit extracted files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract project files from g.zip"
            git push origin HEAD:main
          fi
