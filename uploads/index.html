<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Shop Tycoon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e293b;
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            touch-action: none;
        }
        #game-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        /* Virtual Joystick */
        #joystick-zone {
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        #joystick-base {
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 9999px;
            background: rgba(41, 37, 36, 0.45);
            border: 3px solid rgba(255, 255, 255, 0.55);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 15;
        }
        #joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            background: #7c5dfa;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 0 #4c32b8;
            transform: translate(-50%, -50%);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Casual Tycoon UI Theme Styles */
        .tycoon-pill {
            background: rgba(43, 39, 38, 0.88);
            border: 2px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 4px 0 rgba(15, 14, 13, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        .tycoon-round-btn {
            background: #ffffff;
            border: 2.5px solid #3f3835;
            box-shadow: 0 4px 0 #3f3835;
            color: #3f3835;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tycoon-round-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #3f3835;
        }
        .tycoon-cream-card {
            background: #fcf4e6;
            border: 2.5px solid #cdb8a2;
            box-shadow: 0 4px 0 #b39b82, inset 0 2px 0 #ffffff;
            border-radius: 16px;
            color: #463a31;
        }
        .tycoon-modal-shell {
            background: #f3e6d3;
            border: 3.5px solid #4a3e35;
            box-shadow: 0 10px 0 #2d251f, 0 20px 30px rgba(0, 0, 0, 0.45);
            border-radius: 24px;
            color: #463a31;
        }
        .tycoon-progress-track {
            background: #e6d5c1;
            border: 2px solid #bfa78e;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.12);
        }
        .tycoon-progress-fill {
            background: linear-gradient(180deg, #57e359 0%, #2bb634 100%);
            border-radius: 9999px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4);
            transition: width 0.25s ease;
        }
        .tycoon-progress-fill-amber {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border-radius: 9999px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4);
            transition: width 0.25s ease;
        }
        .tycoon-fab-purple {
            background: linear-gradient(180deg, #8b6eff 0%, #6d4aff 100%);
            border: 3px solid #2e1d6b;
            box-shadow: 0 6px 0 #43289f, inset 0 2px 0 rgba(255, 255, 255, 0.35);
            border-radius: 18px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tycoon-fab-purple:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #43289f, inset 0 2px 0 rgba(255, 255, 255, 0.35);
        }
        .tycoon-fab-blue {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 3px solid #0c4a6e;
            box-shadow: 0 6px 0 #075985, inset 0 2px 0 rgba(255, 255, 255, 0.35);
            border-radius: 18px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tycoon-fab-blue:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #075985, inset 0 2px 0 rgba(255, 255, 255, 0.35);
        }
        .tycoon-btn-green {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            border: 2.5px solid #14532d;
            box-shadow: 0 4px 0 #14532d, inset 0 1.5px 0 rgba(255, 255, 255, 0.4);
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tycoon-btn-green:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #14532d;
        }
        .tycoon-btn-amber {
            background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 100%);
            border: 2.5px solid #78350f;
            box-shadow: 0 4px 0 #78350f, inset 0 1.5px 0 rgba(255, 255, 255, 0.45);
            color: #451a03;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tycoon-btn-amber:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #78350f;
        }
        .tycoon-btn-blue {
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            border: 2.5px solid #1e3a8a;
            box-shadow: 0 4px 0 #1e3a8a, inset 0 1.5px 0 rgba(255, 255, 255, 0.4);
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tycoon-btn-blue:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e3a8a;
        }
        .tycoon-btn-disabled {
            background: #e2d5c4;
            border: 2.5px solid #b5a38f;
            box-shadow: 0 3px 0 #9c8a76;
            color: #8c7a67;
        }
        .tycoon-btn-complete {
            background: #dcfce7;
            border: 2.5px solid #22c55e;
            color: #15803d;
        }
        /* Tactile Tab Switcher Styles */
        .tycoon-tab-bar {
            background: #decbb3;
            border: 2.5px solid #b59e84;
            border-radius: 16px;
            padding: 4px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.12);
        }
        .tycoon-tab-btn {
            border-radius: 11px;
            font-weight: 800;
            color: #6e5c49;
            border: 2px solid transparent;
            transition: all 0.12s ease;
        }
        .tycoon-tab-btn.active {
            background: #fffcf7;
            color: #362c23;
            border: 2px solid #78634d;
            box-shadow: 0 3px 0 #78634d;
            transform: translateY(-1px);
        }
        .text-outline-dark {
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body class="relative w-full h-full overflow-hidden text-slate-100">

    <!-- 3D WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Touch / Mouse Drag Joystick Surface -->
    <div id="joystick-zone"></div>
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <!-- Furniture Placement & Grab Controls (Styled to match Tycoon Theme & Positioned Above Bottom-Right FABs) -->
    <div id="furniture-controls" class="fixed bottom-24 right-4 z-30 flex flex-col gap-2 items-end pointer-events-none">
        <div id="furniture-info" class="tycoon-cream-card px-3 py-2 text-xs font-extrabold max-w-[270px] shadow-lg" style="display:none"></div>
        <div class="flex gap-2 pointer-events-auto">
            <button id="furniture-grab" class="tycoon-btn-blue px-3.5 py-2.5 rounded-xl font-extrabold text-xs shadow-lg" style="display:none">Grab Furniture [E]</button>
            <button id="furniture-rotate" class="tycoon-btn-amber px-3.5 py-2.5 rounded-xl font-extrabold text-xs shadow-lg" style="display:none">Rotate [R]</button>
            <button id="furniture-place" class="tycoon-btn-green px-3.5 py-2.5 rounded-xl font-extrabold text-xs shadow-lg" style="display:none">Place [Space]</button>
        </div>
    </div>
    <div id="hold-progress" class="tycoon-cream-card px-3 py-1.5 text-xs font-extrabold shadow-xl" style="display:none;position:absolute;z-index:35;pointer-events:none;">Hold to move: 0%</div>

    <!-- TOP HUD (Styled after the Casual Tycoon Reference Image) -->
    <header class="absolute top-0 left-0 right-0 z-20 p-2 sm:p-3.5 pointer-events-none">
        <div class="max-w-xl mx-auto w-full flex flex-col gap-2">
            
            <!-- ROW 1: Utility Gear/Zoom Buttons + Resource Pills (Sold, Carry, Cash) -->
            <div class="flex items-center justify-between gap-1.5 sm:gap-2.5 pointer-events-auto">
                
                <!-- Left Utility Buttons (Sound & Camera Zoom) -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button id="btn-sound" class="tycoon-round-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center relative" title="Toggle Audio">
                        <svg id="icon-sound-on" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
                        </svg>
                        <svg id="icon-sound-off" class="w-5 h-5 hidden text-rose-500" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
                        </svg>
                    </button>

                    <button id="btn-zoom" class="tycoon-round-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center" title="Camera Zoom">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 8v6M8 11h6" />
                        </svg>
                    </button>
                </div>

                <!-- Center/Right Resource Pills -->
                <div class="flex items-center justify-end gap-2 sm:gap-3 flex-1 min-w-0">
                    
                    <!-- Star / Sold Pill -->
                    <div class="tycoon-pill flex items-center pl-1 pr-3 py-0.5 sm:py-1 min-w-[74px] sm:min-w-[88px] justify-between">
                        <div class="w-7 h-7 sm:w-8 sm:h-8 -ml-1.5 rounded-full bg-amber-400 border-2 border-amber-900 shadow flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-950" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                            </svg>
                        </div>
                        <span id="stat-sold" class="font-bold text-xs sm:text-sm text-white text-outline-dark mx-auto pl-1">0</span>
                    </div>

                    <!-- Cash Balance Pill -->
                    <div id="money-pill" class="tycoon-pill flex items-center pl-1 pr-3.5 py-0.5 sm:py-1 min-w-[96px] sm:min-w-[118px] justify-between transition-transform duration-150">
                        <div class="w-7 h-7 sm:w-8 sm:h-8 -ml-1.5 rounded-full bg-emerald-500 border-2 border-emerald-950 shadow flex items-center justify-center shrink-0">
                            <span class="text-xs sm:text-sm font-extrabold text-white text-outline-dark">₹</span>
                        </div>
                        <span id="money-display" class="font-bold text-xs sm:text-base text-white text-outline-dark mx-auto pl-1">5,000</span>
                    </div>

                    <!-- Carry Capacity Pill -->
                    <div class="tycoon-pill flex items-center pl-1 pr-3 py-0.5 sm:py-1 min-w-[78px] sm:min-w-[92px] justify-between">
                        <div class="w-7 h-7 sm:w-8 sm:h-8 -ml-1.5 rounded-full bg-sky-400 border-2 border-sky-950 shadow flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4 text-sky-950" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" />
                            </svg>
                        </div>
                        <span id="carry-display" class="font-bold text-xs sm:text-sm text-white text-outline-dark mx-auto pl-1">0/4</span>
                    </div>

                </div>
            </div>

            <!-- ROW 2: Compact Task & Shelf Stock Cards (Decluttered Top HUD) -->
            <div class="grid grid-cols-3 gap-1.5 sm:gap-2 pointer-events-auto">
                
                <!-- Card 1: Current Objective + Stage & Bay Info -->
                <div class="tycoon-cream-card col-span-2 px-2.5 py-1.5 flex flex-col justify-between gap-1">
                    <div class="flex items-center justify-between gap-1">
                        <span id="stage-badge" class="text-[10px] uppercase tracking-wider font-extrabold text-amber-900 bg-amber-300/70 border border-amber-500 px-1.5 py-0.2 rounded-md">
                            Stage 1: Beginner
                        </span>
                        <span id="delivery-status-badge" class="text-[10px] font-extrabold text-emerald-800 bg-emerald-200/80 border border-emerald-400 px-1.5 py-0.2 rounded-md whitespace-nowrap">
                            Bay: 1
                        </span>
                    </div>
                    <p id="objective-text" class="text-[11px] sm:text-xs font-bold text-stone-800 leading-tight line-clamp-1">
                        Walk to the Loading Bay to pick up your starter phone.
                    </p>
                </div>

                <!-- Card 2: Shelf Stock Progress Card -->
                <div class="tycoon-cream-card col-span-1 px-2.5 py-1.5 flex flex-col justify-between gap-1">
                    <div class="text-[10px] sm:text-[11px] font-extrabold text-stone-800 text-center leading-tight">
                        Shelf Stock
                    </div>
                    <div class="tycoon-progress-track h-4 sm:h-5 w-full flex items-center justify-center">
                        <div id="shelf-progress-bar" class="tycoon-progress-fill absolute left-0 top-0 bottom-0" style="width: 0%"></div>
                        <strong id="stat-shelves" class="relative z-10 text-[10px] sm:text-[11px] font-extrabold text-stone-900">0/8</strong>
                    </div>
                </div>

            </div>

            <!-- MODAL 1: SHOP (2 TABS: PHONES & FURNITURE) -->
            <div id="drawer-store" class="hidden pointer-events-auto tycoon-modal-shell p-3 sm:p-4 max-h-[68vh] flex flex-col mt-1">
                <!-- Modal Header -->
                <div class="flex items-center justify-between gap-2 pb-2.5 border-b-2 border-[#d8c4ab] shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-purple-600 border-2 border-purple-950 shadow flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                        </div>
                        <div>
                            <h2 class="text-sm sm:text-base font-extrabold uppercase tracking-wide text-stone-800 leading-none">Store Shop</h2>
                            <span id="manifest-summary" class="text-[10px] font-extrabold text-amber-900">Instant Dispatch Ready</span>
                        </div>
                    </div>
                    <button id="btn-close-store" class="tycoon-round-btn w-8 h-8 rounded-full flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- 2-Tab Switcher: Phones vs Furniture -->
                <div class="tycoon-tab-bar grid grid-cols-2 gap-1.5 my-2.5 shrink-0">
                    <button id="tab-btn-phones" class="tycoon-tab-btn active py-1.5 px-3 text-xs sm:text-sm flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <rect x="7" y="2" width="10" height="20" rx="2" ry="2" />
                            <line x1="12" y1="18" x2="12.01" y2="18" />
                        </svg>
                        <span>Phones</span>
                    </button>
                    <button id="tab-btn-furniture" class="tycoon-tab-btn py-1.5 px-3 text-xs sm:text-sm flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                        <span>Furniture</span>
                    </button>
                </div>

                <!-- Scrollable Tab Content Area -->
                <div class="overflow-y-auto no-scrollbar flex-1 pr-0.5">
                    <!-- Tab 1 Content: Phones -->
                    <div id="tab-content-phones">
                        <div id="panel-brands" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pb-1"></div>
                    </div>

                    <!-- Tab 2 Content: Furniture & Store Expansion -->
                    <div id="tab-content-furniture" class="hidden">
                        <div id="panel-store-upgrades" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pb-1"></div>
                    </div>
                </div>
            </div>

            <!-- MODAL 2: UPGRADES (2 TABS: PLAYER & WORKERS) -->
            <div id="drawer-staff" class="hidden pointer-events-auto tycoon-modal-shell p-3 sm:p-4 max-h-[68vh] flex flex-col mt-1">
                <!-- Modal Header -->
                <div class="flex items-center justify-between gap-2 pb-2.5 border-b-2 border-[#d8c4ab] shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-sky-500 border-2 border-sky-950 shadow flex items-center justify-center text-white shrink-0">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <div>
                            <h2 class="text-sm sm:text-base font-extrabold uppercase tracking-wide text-stone-800 leading-none">Upgrades</h2>
                            <p class="text-[10px] font-bold text-stone-600 mt-0.5">Improve your skills or train your staff</p>
                        </div>
                    </div>
                    <button id="btn-close-staff" class="tycoon-round-btn w-8 h-8 rounded-full flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- 2-Tab Switcher: Player vs Workers -->
                <div class="tycoon-tab-bar grid grid-cols-2 gap-1.5 my-2.5 shrink-0">
                    <button id="tab-btn-player" class="tycoon-tab-btn active py-1.5 px-3 text-xs sm:text-sm flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <span>Player</span>
                    </button>
                    <button id="tab-btn-workers" class="tycoon-tab-btn py-1.5 px-3 text-xs sm:text-sm flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>Workers</span>
                    </button>
                </div>

                <!-- Scrollable Tab Content Area -->
                <div class="overflow-y-auto no-scrollbar flex-1 pr-0.5">
                    <!-- Tab 1 Content: Player Upgrades -->
                    <div id="tab-content-player">
                        <div id="panel-player-upgrades" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pb-1"></div>
                    </div>

                    <!-- Tab 2 Content: Workers Hire & Training -->
                    <div id="tab-content-workers" class="hidden">
                        <div id="panel-staff-upgrades" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pb-1"></div>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <!-- BOTTOM-RIGHT CHUNKY TACTILE ACTION BUTTONS (Styled like the Purple Hammer Button in Reference Image) -->
    <div class="fixed bottom-4 right-4 z-20 flex items-center gap-3 pointer-events-auto">
        
        <!-- Player & Staff Upgrades Button -->

         **********************************************************************/
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq = 440, duration = 0.08, type = 'sine', gainVal = 0.1, slideFreq = null) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (slideFreq) {
                        osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            pickup(stackIndex = 0) {
                this.playTone(320 + stackIndex * 60, 0.07, 'triangle', 0.12, 460 + stackIndex * 60);
            }
            stockShelf() {
                this.playTone(500, 0.08, 'sine', 0.12, 720);
            }
            cashRegister() {
                this.playTone(880, 0.06, 'triangle', 0.12);
                setTimeout(() => this.playTone(1174, 0.12, 'triangle', 0.12), 60);
            }
            collectMoney(combo = 0) {
                const pitch = Math.min(1480, 600 + combo * 45);
                this.playTone(pitch, 0.06, 'sine', 0.1, pitch * 1.15);
            }
            unlock() {
                [440, 554, 659, 880].forEach((f, idx) => {
                    setTimeout(() => this.playTone(f, 0.12, 'triangle', 0.12), idx * 65);
                });
            }

                setTimeout(() => this.playTone(280, 0.15, 'sawtooth', 0.07), 100);

        );

        const ambientLight = new THREE.AmbientLight(0xf8fafc, 0.58);

        // A complete day lasts two real-time minutes. Lighting changes gradually
        // without changing game speed, spawning, or navigation.
        const DAY_LENGTH = 120;
        let timeOfDay = 0;
        const daySky = new THREE.Color(0xc3dcd7), nightSky = new THREE.Color(0x1d2948);
        const dayAmbient = new THREE.Color(0xfff2df), nightAmbient = new THREE.Color(0x839ac8);
        const daySun = new THREE.Color(0xffedcf), nightMoon = new THREE.Color(0x9cb6e8);
        const shopLights = [];
        function updateDayNight(dt) {
            timeOfDay = (timeOfDay + dt) % DAY_LENGTH;
            const sunHeight = Math.cos(timeOfDay / DAY_LENGTH * Math.PI * 2);
            // Smooth twilight around the horizon, rather than a sudden switch.
            const daylight = THREE.MathUtils.smoothstep(sunHeight, -0.28, 0.28);
            scene.background.copy(nightSky).lerp(daySky, daylight);
            ambientLight.color.copy(nightAmbient).lerp(dayAmbient, daylight);
            ambientLight.intensity = 0.38 + daylight * 0.20;
            dirLight.color.copy(nightMoon).lerp(daySun, daylight);
            dirLight.intensity = 0.24 + daylight * 0.38;
            shopLights.forEach(light => { light.intensity = (1 - daylight) * 0.65; });
        }

        const sharedGeos = {
            box: new THREE.BoxGeometry(1, 1, 1),
            cyl: new THREE.CylinderGeometry(1, 1, 1, 10),
            sphere: new THREE.SphereGeometry(1, 12, 10),
            plane: new THREE.PlaneGeometry(1, 1)
        };

        const matCache = new Map();
        function getMat(colorHex) {
            if (!matCache.has(colorHex)) {
                matCache.set(colorHex, new THREE.MeshLambertMaterial({ color: colorHex }));
            }
            return matCache.get(colorHex);
        }

        // Rounded profile in plan: low-segment corners preserve a crisp, stylized silhouette.
        function roundedSlab(w, h, d, radius, color) {
            const r = Math.min(radius, w / 2, d / 2), shape = new THREE.Shape();
            shape.moveTo(-w / 2 + r, -d / 2); shape.lineTo(w / 2 - r, -d / 2); shape.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
            shape.lineTo(w / 2, d / 2 - r); shape.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
            shape.lineTo(-w / 2 + r, d / 2); shape.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
            shape.lineTo(-w / 2, -d / 2 + r); shape.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
            const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 2 });
            geo.rotateX(-Math.PI / 2); geo.translate(0, -h / 2, 0);
            return new THREE.Mesh(geo, getMat(color));
        }
        const shadowBlobMat = new THREE.MeshBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.25, depthWrite: false });

        function createFloorSignMesh(title, subtitle, bgHex = '#0f172a', borderHex = '#3b82f6', width = 2.8, height = 1.1) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 96;
            const ctx = c.getContext('2d');

            ctx.fillStyle = bgHex;
            ctx.fillRect(0, 0, 256, 96);
            ctx.strokeStyle = borderHex;
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 248, 88);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 24px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, 128, subtitle ? 44 : 56);

            if (subtitle) {
                ctx.fillStyle = '#38bdf8';
                ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(subtitle, 128, 74);
            }

            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter;
            const mat = new THREE.MeshBasicMaterial({ map: tex });
            const mesh = new THREE.Mesh(sharedGeos.plane, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.scale.set(width, height, 1);
            return { mesh, canvas: c, ctx, tex };
        }

        /**********************************************************************
         * 5. RAPIER3D WASM INITIALIZATION
         **********************************************************************/
        let rapierWorld = null;

        async function initRapierPhysics() {

                await RAPIER.init();

                const groundDesc = RAPIER.ColliderDesc.cuboid(40.0, 0.5, 40.0).setTranslation(0, -0.5, 0);

                const palletDesc = RAPIER.ColliderDesc.cuboid(2.2, 0.15, 2.2)

                rapierWorld.createCollider(palletDesc);

                rapierReady = true;
            } catch (err) {
                console.warn('Rapier fallback mode:', err);
            }
        }

        /**********************************************************************

        function createPhoneItemMesh(brand) {

        // Smooth, hand-shaped surfaces shared across characters. A lathed profile
        // gives each body part a continuous silhouette instead of stacked primitives.
        function characterSurface(profile) {
            return new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), 24);
        }
        const characterGeos = {
            torso: characterSurface([[0,0],[.23,.01],[.31,.09],[.33,.25],[.37,.52],[.34,.69],[.25,.77],[.12,.79],[0,.79]]),
            arm: characterSurface([[0,-.59],[.09,-.58],[.125,-.51],[.13,-.35],[.155,-.17],[.17,-.04],[.14,.07],[0,.10]]),
            leg: characterSurface([[0,-.57],[.12,-.56],[.15,-.49],[.15,-.30],[.17,-.08],[.15,.07],[0,.10]]),
            head: new THREE.SphereGeometry(1, 24, 18),

        function createStickman(colorHex, options = {}) {
            const root = new THREE.Group(), bodyRig = new THREE.Group(); root.add(bodyRig);
            // Keep navigation and carried objects in world units; only the visible person is scaled.
            bodyRig.scale.setScalar(0.82);
            const shadow = new THREE.Mesh(sharedGeos.plane, shadowBlobMat);
            shadow.rotation.x = -Math.PI / 2; shadow.scale.set(0.72, 0.72, 1); shadow.position.y = 0.02; root.add(shadow);
            const skinTones = [0xe4b899, 0xc98e6b, 0xf1c5a5, 0x98684e];
            const skin = options.hatColor ? 0xe4b899 : skinTones[Math.floor(Math.random() * skinTones.length)];
            const pants = 0x303c51, shoes = 0x293344, shirt = options.vestColor || colorHex;
            function part(parent, geo, color, x, y, z, sx, sy, sz) {
                const mesh = new THREE.Mesh(geo, getMat(color)); mesh.position.set(x,y,z);
                mesh.scale.set(sx,sy,sz); mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
            }
            part(bodyRig, characterGeos.torso, shirt, 0, .76, 0, 1, 1, .78);
            // Collar, neck and a smoothly rounded head with a simple expressive face.
            part(bodyRig, characterGeos.head, skin, 0, 1.53, 0, .12, .15, .12);
            part(bodyRig, characterGeos.head, skin, 0, 1.79, 0, .29, .33, .27);
            part(bodyRig, characterGeos.head, skin, -.29, 1.78, 0, .055, .075, .055);
            part(bodyRig, characterGeos.head, skin, .29, 1.78, 0, .055, .075, .055);
            for (const x of [-.105, .105]) {
                part(bodyRig, characterGeos.head, 0x303344, x, 1.81, .257, .025, .034, .012);
                part(bodyRig, characterGeos.head, 0xffffff, x-.007, 1.823, .268, .007, .009, .005);
            }
            part(bodyRig, characterGeos.head, 0xb66e60, 0, 1.675, .258, .055, .014, .012);
            if (options.hatColor) {
                part(bodyRig, characterGeos.hair, options.hatColor, 0, 2.00, 0, .31, .19, .29);
                const brim = roundedSlab(.48, .045, .25, .08, options.hatColor); brim.position.set(0, 2.01, .18); bodyRig.add(brim);
            } else {
                part(bodyRig, characterGeos.hair, 0x41342f, 0, 1.94, -.02, .305, .22, .28);
            }
            function limb(x, y, isArm) {
                const pivot = new THREE.Group(); pivot.position.set(x,y,0); bodyRig.add(pivot);
                if (isArm) {
                    part(pivot, characterGeos.arm, shirt, 0, 0, 0, 1, 1, .9);
                    part(pivot, characterGeos.head, skin, 0, -.56, .01, .105, .13, .10);
                } else {
                    part(pivot, characterGeos.leg, pants, 0, 0, 0, 1, 1, .92);
                    part(pivot, characterGeos.head, shoes, 0, -.56, .07, .15, .095, .21);
                }
                return pivot;
            }
            const leftArm = limb(-.34, 1.42, true), rightArm = limb(.34, 1.42, true);
            const leftLeg = limb(-.17, .71, false), rightLeg = limb(.17, .71, false);
            const carryAnchor = new THREE.Group(); carryAnchor.position.set(0, .87, .48); root.add(carryAnchor);
            let statusBadge = null;
            if (options.hasStatusBadge) {
                statusBadge = new THREE.Mesh(sharedGeos.box, getMat(0x38bdf8));
                statusBadge.scale.set(.23,.23,.23); statusBadge.position.set(0,2.05,0);
                statusBadge.rotation.y = Math.PI / 4; statusBadge.visible = false; root.add(statusBadge);
            }
            root.userData = { bodyRig, leftLeg, rightLeg, leftArm, rightArm, carryAnchor, statusBadge, walkCycle: Math.random() * 10 };
            return root;
        }

        function animateStickman(stickman, isMoving, isCarrying, dt) {
            const u = stickman.userData;

                } else {
                    u.leftArm.rotation.x = -swing * 0.65;
                    u.rightArm.rotation.x = swing * 0.65;

                u.leftLeg.rotation.x *= 0.8;
                u.rightLeg.rotation.x *= 0.8;
                u.bodyRig.position.y *= 0.8;
                u.bodyRig.rotation.z *= 0.8;

        function orderSupplierDelivery(brandId, quantity = 3) {
            const brand = PHONE_BRANDS.find(b => b.id === brandId);
            if (!brand) return;

            if (!brand.unlocked) {
                if (state.money < brand.unlockCost) {
                    showToast(`Need ₹${brand.unlockCost.toLocaleString('en-IN')} to unlock ${brand.name}`);
                    return;
                }
                state.money -= brand.unlockCost;
                brand.unlocked = true;
                sfx.unlock();
                showToast(`Unlocked ${brand.name} (${brand.model})`);
                renderAllMenus();
                updateHUD();
                return;
            }

            const unitCost = Math.round(brand.boxPrice / brand.boxCount);
            const totalOrderCost = quantity === brand.boxCount ? brand.boxPrice : unitCost * quantity;

            if (state.money < totalOrderCost) {
                showToast(`Need ₹${totalOrderCost.toLocaleString('en-IN')} to order ${quantity}x ${brand.name}`);
                return;
            }

            state.money -= totalOrderCost;

            const existing = state.pendingOrders.find(o => o.brand.id === brand.id);
            if (existing) {
                existing.count += quantity;
            } else {
                state.pendingOrders.push({ brand, count: quantity });
            }

            if (activeTruckAnim && activeTruckAnim.phase === 'unload') {
                while (state.pendingOrders.length > 0) {
                    const order = state.pendingOrders.shift();
                    spawnSupplyCrateAtBay(order.brand, order.count, false);
                }
                sfx.pickup(2);
                showToast(`Added ${quantity}x ${brand.name} to current drop`);
            } else {
                sfx.pickup(1);
                dispatchTruckIfNeeded();
                const totalQueued = state.pendingOrders.reduce((sum, o) => sum + o.count, 0);

        function updateFurniture(dt) {
            for (const p of furnitureParcels) {
                p.vy -= 18 * dt;
                p.group.position.y = Math.max(0.65, p.group.position.y + p.vy * dt);
            }
            const near = player.pos.distanceTo(LOADING_BAY_POS) < 3 && furnitureParcels.length > 0 && !furnitureCarry;
            furnitureUI.grab.style.display = near ? 'block' : 'none';
            furnitureUI.rotate.style.display = furnitureCarry ? 'block' : 'none';
            furnitureUI.place.style.display = furnitureCarry ? 'block' : 'none';

            if (furnitureCarry) {
                const t = furnitureCarry.type;
                const quarter = Math.round(placementRotation / (Math.PI / 2)) % 2 !== 0;
                const w = quarter ? t.depth : t.width, d = quarter ? t.width : t.depth;
                const dist = 1.05 + Math.max(w, d) * 0.5;
                const x = player.pos.x + Math.sin(player.angle) * dist;
                const z = player.pos.z + Math.cos(player.angle) * dist;
                furniturePreview.position.set(x, 0.08, z);
                furniturePreview.rotation.y = placementRotation;

                const maxX = state.shopExpanded ? 10.2 : 7;
                placementValid = x - w / 2 >= -6.5 && x + w / 2 <= maxX && z - d / 2 >= -5.8 && z + d / 2 <= 5.35;
                const overlap = (ax, az, aw, ad, bx, bz, bw, bd) => Math.abs(ax - bx) < (aw + bw) / 2 + 0.14 && Math.abs(az - bz) < (ad + bd) / 2 + 0.14;

                if (
                    overlap(x, z, w, d, COUNTER_POS.x, COUNTER_POS.z, 3.5, 1.7) ||
                    overlap(x, z, w, d, LOADING_BAY_POS.x, LOADING_BAY_POS.z, 3.8, 3.8) ||
                    overlap(x, z, w, d, 1.5, 5.4, 2, 1.4)
                ) {
                    placementValid = false;
                }
                for (const s of shelves) {
                    if (s.unlocked) {
                        const q = Math.round(s.rotation / (Math.PI / 2)) % 2 !== 0;
                        const sw = q ? s.type.depth : s.type.width, sd = q ? s.type.width : s.type.depth;
                        if (overlap(x, z, w, d, s.pos.x, s.pos.z, sw, sd)) placementValid = false;
                    }
                }
                const actors = [player, ...customers];
                if (stockerStaff) actors.push(stockerStaff);
                if (cashierStaff) actors.push(cashierStaff);
                for (const actor of actors) {
                    if (circleHitsRect(actor.pos.x, actor.pos.z, ACTOR_RADIUS + 0.12, { x, z, w, d })) placementValid = false;
                }
                furniturePreview.traverse(o => {
                    if (o.isMesh) o.material.color.setHex(placementValid ? 0x22ee88 : 0xf43f5e);
                });
                furnitureUI.info.style.display = 'block';
                furnitureUI.info.textContent = `${t.name} · ${t.width.toFixed(1)} × ${t.depth.toFixed(1)} m · ${t.cols * t.rows * t.levels} slots · ${placementValid ? 'Green: Ready to place' : 'Red: Blocked / outside shop'}`;
                furnitureUI.place.className = placementValid
                    ? 'tycoon-btn-green px-3.5 py-2.5 rounded-xl font-extrabold text-xs shadow-lg'
                    : 'tycoon-btn-disabled px-3.5 py-2.5 rounded-xl font-extrabold text-xs shadow-lg';
            } else {
                furnitureUI.info.style.display = near ? 'block' : 'none';
                if (near) furnitureUI.info.textContent = `${furnitureParcels.length} furniture package(s) in bay. Grab to start placing.`;
            }

            if (holdFurniture) {
                holdFurniture.elapsed += dt;
                furnitureUI.hold.textContent = `Hold to move: ${Math.min(100, Math.floor((holdFurniture.elapsed / 2) * 100))}%`;
                if (holdFurniture.elapsed >= 2) {
                    const shelf = holdFurniture.shelf;
                    cancelFurnitureHold();
                    startFurniture(shelf.type, shelf);
                }
            }
        }

        function placeFurniture() {
            if (!furnitureCarry) return;

            const pos = furniturePreview.position.clone(), data = furnitureCarry;

            if (shelf) {
                shelf.pos.copy(pos);

                    item.mesh.visible = true;

            }
            worldGroup.remove(furniturePreview);
            furniturePreview.traverse(o => { if (o.isMesh) o.material.dispose(); });

        function tryFurnitureHold(e) {
            if (furnitureCarry) return false;
            const ray = new THREE.Raycaster();
            const v = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            ray.setFromCamera(v, camera);
            const hits = ray.intersectObjects(shelves.filter(s => s.unlocked).map(s => s.group), true);
            for (const hit of hits) {
                const shelf = shelves.find(s => s.unlocked && s.group === hit.object.parent);
                if (shelf && player.pos.distanceTo(shelf.pos) < 3.6) {
                    holdFurniture = { shelf, elapsed: 0, x: e.clientX, y: e.clientY, pointer: e.pointerId };
                    furnitureUI.hold.style.display = 'block';
                    furnitureUI.hold.style.left = Math.min(window.innerWidth - 150, e.clientX + 12) + 'px';
                    furnitureUI.hold.style.top = Math.max(10, e.clientY - 45) + 'px';
                    return true;
                }
            }
            return false;
        }

        const input = { joyVec: new THREE.Vector2(0, 0), keys: Object.create(null) };

        let activePointerId = null;
        let joystickOrigin = { x: 0, y: 0 };

        function updateJoystick(clientX, clientY) {
            const dx = clientX - joystickOrigin.x;
            const dy = clientY - joystickOrigin.y;
            const distance = Math.hypot(dx, dy);
            const radius = 42;
            const scale = distance > radius ? radius / distance : 1;
            const x = dx * scale;
            const y = dy * scale;
            input.joyVec.set(x / radius, y / radius);
            joystickKnob.style.left = `calc(50% + ${x}px)`;
            joystickKnob.style.top = `calc(50% + ${y}px)`;
        }

        joystickZone.addEventListener('pointerdown', (event) => {
            if (event.target.closest('button')) return;
            if (activePointerId !== null) return;
            if (tryFurnitureHold(event)) { joystickZone.setPointerCapture(event.pointerId); return; }
            activePointerId = event.pointerId;
            joystickOrigin = { x: event.clientX, y: event.clientY };
            joystickBase.style.left = `${event.clientX}px`;
            joystickBase.style.top = `${event.clientY}px`;
            joystickBase.style.display = 'block';
            joystickKnob.style.left = '50%';
            joystickKnob.style.top = '50%';
            joystickZone.setPointerCapture(event.pointerId);
            updateJoystick(event.clientX, event.clientY);
        });
        joystickZone.addEventListener('pointermove', (event) => {
            if (holdFurniture && event.pointerId === holdFurniture.pointer && Math.hypot(event.clientX - holdFurniture.x, event.clientY - holdFurniture.y) > 18) cancelFurnitureHold();
            if (event.pointerId === activePointerId) updateJoystick(event.clientX, event.clientY);
        });
        function releaseJoystick(event) {
            if (holdFurniture && event.pointerId === holdFurniture.pointer) cancelFurnitureHold();
            if (event.pointerId !== activePointerId) return;
            activePointerId = null;
            input.joyVec.set(0, 0);
            joystickBase.style.display = 'none';
        }
        joystickZone.addEventListener('pointerup', releaseJoystick);
        joystickZone.addEventListener('pointercancel', releaseJoystick);
        window.addEventListener('keydown', (event) => {
            if (!event.repeat && event.code === 'KeyE') grabFurniture();
            if (!event.repeat && event.code === 'KeyR' && furnitureCarry) placementRotation += Math.PI / 2;
            if (!event.repeat && event.code === 'Space' && furnitureCarry) placeFurniture();
            input.keys[event.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
        });
        window.addEventListener('keyup', (event) => { input.keys[event.code] = false; });
        window.addEventListener('blur', () => {
            Object.keys(input.keys).forEach(key => { input.keys[key] = false; });
            input.joyVec.set(0, 0);
            activePointerId = null;
            joystickBase.style.display = 'none';
        });

        function purchaseLevelUpgrade(upgradeId) {
            const upg = LEVEL_UPGRADES.find(u => u.id === upgradeId);
            if (!upg || upg.level >= upg.maxLevel) return;

            if (upg.requires) {
                const req = LEVEL_UPGRADES.find(r => r.id === upg.requires);
                if (!req || req.level === 0) {
                    showToast(`Hire ${req ? req.name.replace('Hire ', '') : 'staff'} first`);
                    return;
                }
            }

            const cost = getUpgradeCost(upg);
            if (state.money < cost) {
                showToast(`Need ₹${cost.toLocaleString('en-IN')} for ${upg.name}`);
                return;
            }

            state.money -= cost;
            upg.level += 1;
            sfx.unlock();

            if (upgradeId === 'player_carry') {
                state.maxCarry = 4 + (upg.level - 1) * 2;
                showToast(`Player Carry Limit upgraded to ${state.maxCarry} phones`);
            } else if (upgradeId === 'player_speed') {
                state.playerSpeed = BASE_PLAYER_SPEED * (1 + (upg.level - 1) * 0.10);
                showToast(`Player Speed upgraded to Lv.${upg.level}`);

                state.stockerMaxCarry = 3 + (upg.level - 1) * 2;

        /**********************************************************************
         * 15. NAVIGATION, PATHFINDING & MAIN GAME LOOP
         **********************************************************************/
        let lastTime = performance.now();
        const scratchVecA = new THREE.Vector3();
        const scratchVecB = new THREE.Vector3();
        const CHECKOUT_QUEUE_FRONT = new THREE.Vector3(COUNTER_POS.x, 0.08, COUNTER_POS.z + 1.45);

        const ACTOR_RADIUS = 0.42, NAV_STEP = 0.5, NAV_X0 = -16, NAV_Z0 = -6, NAV_W = 65, NAV_H = 31;

        function shelfRect(s) {
            const q = Math.abs(Math.round(s.rotation / (Math.PI / 2))) % 2 === 1;
            return { x: s.pos.x, z: s.pos.z, w: q ? s.type.depth : s.type.width, d: q ? s.type.width : s.type.depth };
        }
        function circleHitsRect(x, z, r, b) {
            const dx = Math.max(Math.abs(x - b.x) - b.w / 2, 0), dz = Math.max(Math.abs(z - b.z) - b.d / 2, 0);
            return dx * dx + dz * dz < r * r;
        }
        function worldBlocked(x, z, r = ACTOR_RADIUS) {
            const walls = [
                { x: backWall.position.x, z: -6.5, w: backWall.scale.x, d: 0.45 },
                { x: -6.5, z: -2.5, w: 0.45, d: 8.5 }
            ];
            for (const b of walls) if (circleHitsRect(x, z, r, b)) return true;
            if (circleHitsRect(x, z, r, { x: COUNTER_POS.x, z: COUNTER_POS.z, w: 2.95, d: 1.5 })) return true;
            for (const shelf of shelves) if (shelf.unlocked && circleHitsRect(x, z, r, shelfRect(shelf))) return true;
            return false;
        }
        function distanceToShelf(p, s) {
            const b = shelfRect(s);
            return Math.hypot(Math.max(0, Math.abs(p.x - b.x) - b.w / 2), Math.max(0, Math.abs(p.z - b.z) - b.d / 2));
        }
        function shelfApproaches(s) {
            const b = shelfRect(s), pts = [], gap = 0.70;
            for (const side of [-1, 1]) {
                for (let x = -b.w / 2 + 0.48; x <= b.w / 2 - 0.45; x += 1.02) pts.push(new THREE.Vector3(b.x + x, 0.08, b.z + side * (b.d / 2 + gap)));
                for (let z = -b.d / 2 + 0.48; z <= b.d / 2 - 0.45; z += 1.02) pts.push(new THREE.Vector3(b.x + side * (b.w / 2 + gap), 0.08, b.z + z));
            }
            return pts.filter(p => p.x >= -9 && p.x <= (state.shopExpanded ? 10.2 : 7) && p.z >= -5.8 && p.z <= 5.4 && !worldBlocked(p.x, p.z));
        }
        function nearestShelfApproach(s, p) {
            const points = shelfApproaches(s);
            points.sort((a, b) => a.distanceToSquared(p) - b.distanceToSquared(p));
            return points[0] || null;
        }
        function releaseBrowse(c) { c.browsePos = null; c.targetShelf = null; c.waitTimer = 0; }
        function reserveBrowseSpot(c) {
            const reserved = customers.filter(o => o !== c && o.state === 'BROWSING' && o.browsePos).map(o => o.browsePos);
            const candidates = [];
            for (const sh of shelves) if (sh.unlocked) for (const p of shelfApproaches(sh)) {
                if (reserved.some(o => o.distanceTo(p) < 1.05)) continue;
                candidates.push({ s: sh, p, score: c.pos.distanceToSquared(p) + (sh.items.length ? 0 : 250) });
            }
            candidates.sort((a, b) => a.score - b.score);
            if (candidates.length) { c.targetShelf = candidates[0].s; c.browsePos = candidates[0].p; c.nav = null; }
        }
        function queuePosition(index, queue) {
            if (index < 0) return null;
            const used = [];
            for (let i = 0; i <= index; i++) {
                const preferred = new THREE.Vector3(COUNTER_POS.x, 0.08, COUNTER_POS.z + 1.45 + i * 1.12);
                const choices = [];
                for (let ring = 0; ring <= 8; ring++) {
                    for (let dx = -ring; dx <= ring; dx++) for (let dz = -ring; dz <= ring; dz++) {
                        if (Math.max(Math.abs(dx), Math.abs(dz)) !== ring) continue;
                        const p = new THREE.Vector3(preferred.x + dx * 0.55, 0.08, preferred.z + dz * 0.55);
                        if (p.x < -6 || p.x > 7 || p.z < -5.8 || p.z > 7.5 || worldBlocked(p.x, p.z)) continue;
                        if (used.some(u => u.distanceTo(p) < 1.05)) continue;
                        if (customers.some(o => o.state === 'BROWSING' && o.browsePos && o.browsePos.distanceTo(p) < 1)) continue;
                        choices.push(p);
                    }
                    if (choices.length) break;
                }
                choices.sort((a, b) => a.distanceToSquared(preferred) - b.distanceToSquared(preferred));
                if (!choices.length) return null;
                used.push(choices[0]);
            }
            return used[index];
        }
        function gridIndex(x, z) { return z * NAV_W + x; }
        function gridPoint(x, z) { return new THREE.Vector3(NAV_X0 + x * NAV_STEP, 0.08, NAV_Z0 + z * NAV_STEP); }
        function navPath(from, to, agent, avoidPeople) {
            const snap = p => ({ x: Math.max(0, Math.min(NAV_W - 1, Math.round((p.x - NAV_X0) / NAV_STEP))), z: Math.max(0, Math.min(NAV_H - 1, Math.round((p.z - NAV_Z0) / NAV_STEP))) });
            const start = snap(from), goal = snap(to), total = NAV_W * NAV_H;
            const blocked = new Int8Array(total); blocked.fill(-1);
            const others = [player, ...customers]; if (stockerStaff) others.push(stockerStaff); if (cashierStaff) others.push(cashierStaff);
            const other = avoidPeople ? others.filter(c => c !== agent).map(c => c.pos) : [];
            function blockedAt(x, z) {
                if (x < 0 || x >= NAV_W || z < 0 || z >= NAV_H) return true;
                const i = gridIndex(x, z); if (blocked[i] >= 0) return blocked[i] === 1;
                const p = gridPoint(x, z);
                const b = worldBlocked(p.x, p.z, ACTOR_RADIUS + 0.04) || other.some(o => o.distanceToSquared(p) < 0.9 * 0.9 && p.distanceToSquared(to) > 0.65 * 0.65 && p.distanceToSquared(from) > 0.75 * 0.75);
                blocked[i] = b ? 1 : 0; return b;
            }
            let best = null, bd = Infinity;
            for (let z = Math.max(0, goal.z - 3); z <= Math.min(NAV_H - 1, goal.z + 3); z++) for (let x = Math.max(0, goal.x - 3); x <= Math.min(NAV_W - 1, goal.x + 3); x++) {
                if (blockedAt(x, z)) continue;

                const c = dynamicCrates[i];

                    const r = c.body.rotation();
                    const clampedX = Math.max(LOADING_BAY_POS.x - 1.5, Math.min(LOADING_BAY_POS.x + 1.5, t.x));
                    const clampedZ = Math.max(LOADING_BAY_POS.z - 1.5, Math.min(LOADING_BAY_POS.z + 1.5, t.z));
                    c.mesh.position.set(clampedX, Math.max(0.24, t.y), clampedZ);
                    c.mesh.quaternion.set(r.x, r.y, r.z, r.w);

                    c.vy -= 18 * dt;

            }

            // 2. Delivery Van Animation

                    if (Math.abs(truckGroup.position.x - (-6.5)) < 0.25) {
                        activeTruckAnim.phase = 'unload';
                        activeTruckAnim.timer = 0;

                        let totalUnloaded = 0;
                        while (state.pendingOrders.length > 0) {
                            const order = state.pendingOrders.shift();
                            spawnSupplyCrateAtBay(order.brand, order.count, false);
                            totalUnloaded += order.count;
                        }
                        sfx.pickup(2);
                        if (totalUnloaded > 0) {
                            showToast(`Delivery van unloaded ${totalUnloaded} phones at Loading Bay`);
                        }
                        renderAllMenus();
                        updateHUD();
                    }
                } else if (activeTruckAnim.phase === 'unload') {
                    if (activeTruckAnim.timer > 0.75) activeTruckAnim.phase = 'depart';
                } else if (activeTruckAnim.phase === 'depart') {
                    truckGroup.position.x += dt * 18;
                    if (truckGroup.position.x > 24) {
                        activeTruckAnim = null;

                        renderAllMenus();

                            dispatchTruckIfNeeded();
                        }

            let rawY = input.joyVec.y;

            if (input.keys['KeyS'] || input.keys['ArrowDown']) rawY += 1;
            if (input.keys['KeyA'] || input.keys['ArrowLeft']) rawX -= 1;
            if (input.keys['KeyD'] || input.keys['ArrowRight']) rawX += 1;

            const mag = Math.hypot(rawX, rawY);
            let isPlayerMoving = false;
            if (mag > 0.05) {
                isPlayerMoving = true;
                const nx = rawX / Math.max(1, mag);
                const ny = rawY / Math.max(1, mag);

                const worldVX = (nx + ny) * 0.7071;
                const worldVZ = (ny - nx) * 0.7071;

                player.vel.set(worldVX * state.playerSpeed, 0, worldVZ * state.playerSpeed);
                const oldX = player.pos.x, oldZ = player.pos.z;
                const nextX = oldX + player.vel.x * dt, nextZ = oldZ + player.vel.z * dt;
                if (!worldBlocked(nextX, oldZ, ACTOR_RADIUS)) player.pos.x = nextX;
                if (!worldBlocked(player.pos.x, nextZ, ACTOR_RADIUS)) player.pos.z = nextZ;
                isPlayerMoving = Math.hypot(player.pos.x - oldX, player.pos.z - oldZ) > 0.0001;

                const maxRight = state.shopExpanded ? 10.2 : 7.0;
                player.pos.x = Math.max(-9.0, Math.min(maxRight, player.pos.x));
                player.pos.z = Math.max(-5.8, Math.min(8.2, player.pos.z));

                const targetAngle = Math.atan2(worldVX, worldVZ);
                let diff = targetAngle - player.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                player.angle += diff * Math.min(1, dt * 15);

                player.vel.set(0, 0, 0);

            player.mesh.rotation.y = player.angle;
            animateStickman(player.mesh, isPlayerMoving, player.carryStack.length > 0, dt);

            // Carry Stack Follow
            player.mesh.userData.carryAnchor.getWorldPosition(scratchVecA);
            for (let i = 0; i < player.carryStack.length; i++) {

                item.mesh.position.z = THREE.MathUtils.lerp(item.mesh.position.z, scratchVecA.z, wobbleLag);
                item.mesh.position.y = scratchVecA.y + i * 0.19;
                item.mesh.rotation.y = player.angle;
            }

            updateFurniture(dt);

            // Camera Follow

            const targetCamZ = player.pos.z * 0.35 + ISO_OFFSET.z;
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, dt * 5);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, dt * 5);
            camera.lookAt(camera.position.x - ISO_OFFSET.x, 0, camera.position.z - ISO_OFFSET.z);

                !furnitureCarry && player.pos.distanceTo(LOADING_BAY_POS) < 2.9 &&
                dynamicCrates.length > 0 &&
                player.carryStack.length < state.maxCarry &&
                player.pickupCooldown <= 0

                const crate = dynamicCrates.pop();

                crate.mesh.rotation.set(0, player.angle, 0);
                player.carryStack.push({ mesh: crate.mesh, brand: crate.brand });
                sfx.pickup(player.carryStack.length);
                updateHUD();

            if (!furnitureCarry && player.carryStack.length > 0 && player.stockCooldown <= 0) {
                for (let i = 0; i < shelves.length; i++) {
                    const shelf = shelves[i];
                    if (!shelf.unlocked || shelf.items.length >= shelf.capacity) continue;

                        player.stockCooldown = 0.16;

            const playerAtCounter = player.pos.distanceTo(CASHIER_SPOT) < 1.75;
            standRing.material.color.setHex(playerAtCounter || cashierStaff ? 0x22c55e : 0x38bdf8);

            if (
                frontCustomer &&
                frontCustomer.pos.distanceTo(CHECKOUT_QUEUE_FRONT) < 0.65 &&
                (playerAtCounter || cashierStaff)
            ) {
                const speedMultiplier = cashierStaff ? state.checkoutSpeedMult : 1.0;
                checkoutProgress += dt * 2.4 * speedMultiplier;
                if (checkoutProgress >= 1.0) {

                    const soldBrand = frontCustomer.carriedItem ? frontCustomer.carriedItem.brand : PHONE_BRANDS[0];
                    const saleAmount = soldBrand.sellPrice;

                    state.totalRevenue += saleAmount;

                    addCashToPile(saleAmount);

                    frontCustomer.targetPos = new THREE.Vector3(Math.random() < 0.5 ? -15 : 15, 0.08, 8.0);

            for (let i = activeArcs.length - 1; i >= 0; i--) {
                const a = activeArcs[i];
                a.elapsed += dt;
                const t = Math.min(1, a.elapsed / a.duration);
                a.mesh.position.lerpVectors(a.start, a.end, t);
                a.mesh.position.y += Math.sin(t * Math.PI) * 1.55;
                if (t >= 1) {
                    if (a.onComplete) a.onComplete();
                    activeArcs.splice(i, 1);
                }

        }

            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            updateGame(dt);
            updateTraffic(dt);
            updateDayNight(dt);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const asp = w / h;
            camera.left = -frustumSize * asp;
            camera.right = frustumSize * asp;
            camera.top = frustumSize;
            camera.bottom = -frustumSize;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onWindowResize);

        /**********************************************************************
         * 16. BOOTSTRAP GAME
         **********************************************************************/
        window.onload = async function () {
            await initRapierPhysics();

            spawnSupplyCrateAtBay(PHONE_BRANDS[0], 1, true);
            spawnCustomer();

            renderAllMenus();
            updateHUD();
            requestAnimationFrame(animate);
        };
